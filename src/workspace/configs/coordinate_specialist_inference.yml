__include__:
  - ./coordinate_specialist_full.yml

# Inference-only loader.  The annotation file contains only the sorted official
# test image identities, dimensions and the single category; annotations=[] .
val_dataloader:
  total_batch_size: 4
  num_workers: 4
  dataset:
    # The public inference entry point replaces both paths at runtime.
    img_folder: data/test/images
    ann_file: data/runtime/images.json
    transforms:
      ops:
        - {type: Resize, size: [1024, 1024]}
        - {type: ConvertPILImage, dtype: float32, scale: true}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
